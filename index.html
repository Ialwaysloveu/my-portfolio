<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" id="meta-description" content="">
    <title id="page-title"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container" id="nav">
            <a href="#" class="nav__logo" id="nav-logo"></a>
            <ul class="nav__list" id="nav-list"></ul>
            <button class="nav__toggle" aria-label="Toggle menu" id="nav-toggle">
                <span class="nav__toggle-icon"></span>
            </button>
        </nav>
    </header>

    <main>
        <section class="hero" id="hero">
            <div class="container hero__container">
                <div class="hero__content">
                    <p class="hero__subtitle" id="hero-subtitle"></p>
                    <h1 class="hero__title" id="hero-title"></h1>
                    <p class="hero__description" id="hero-description"></p>
                    <div class="hero__cta">
                        <a href="#" class="btn btn--primary" id="hero-cta-primary">View Projects</a>
                    </div>
                    <div class="hero__social" id="hero-social"></div>
                </div>
                <div class="hero__image">
                    <img src="" alt="" class="hero__photo" id="hero-photo">
                </div>
            </div>
        </section>

        <section class="expertise" id="expertise">
            <div class="container">
                <header class="section-header">
                    <h2 class="section-title" id="expertise-title">Skills &amp; Expertise</h2>
                    <p class="section-subtitle" id="expertise-subtitle">What I know</p>
                </header>
                <div class="expertise__grid" id="expertise-grid"></div>
            </div>
        </section>

        <section class="education" id="education">
            <div class="container">
                <header class="section-header">
                    <h2 class="section-title" id="education-title">Education</h2>
                    <p class="section-subtitle" id="education-subtitle">My academic background</p>
                </header>
                <div class="education__list" id="education-list"></div>
            </div>
        </section>

        <section class="works" id="works">
            <div class="container">
                <header class="section-header">
                    <h2 class="section-title" id="works-title">Projects</h2>
                    <p class="section-subtitle" id="works-subtitle">Things I have built</p>
                </header>
                <div class="works__grid" id="works-grid"></div>
            </div>
        </section>

        <section class="certificates" id="certificates">
            <div class="container">
                <header class="section-header">
                    <h2 class="section-title" id="certificates-title">Certificates</h2>
                    <p class="section-subtitle" id="certificates-subtitle">Verified achievements</p>
                </header>
                <div class="certificates__list" id="certificates-list"></div>
            </div>
        </section>

        <section class="about" id="about">
            <div class="container about__container">
                <div class="about__content">
                    <header class="section-header section-header--left">
                        <h2 class="section-title" id="about-title">About Me</h2>
                        <p class="section-subtitle" id="about-subtitle">Get to know me</p>
                    </header>
                    <div class="about__intro" id="about-intro"></div>
                    <blockquote class="about__quote" id="about-quote"></blockquote>

                    <div class="about__skills" id="about-skills">
                        <h3 class="about__skills-title" id="skills-title">What I've Learned</h3>
                        <div class="skills__tags" id="skills-bars"></div>
                    </div>

                    <div class="about__tools" id="about-tools" style="display: none;">
                        <h3 class="about__tools-title" id="tools-title">Tools I Use</h3>
                        <div class="tools__list" id="tools-list"></div>
                    </div>
                </div>
                <div class="about__info">
                    <div class="info-card" id="info-design-for">
                        <span class="info-card__label">Focus</span>
                        <span class="info-card__value" id="info-design-for-value"></span>
                    </div>
                    <div class="info-card" id="info-email">
                        <span class="info-card__label">Email</span>
                        <a href="mailto:" class="info-card__value" id="info-email-value"></a>
                    </div>
                    <div class="info-card" id="info-location">
                        <span class="info-card__label">Address</span>
                        <span class="info-card__value" id="info-location-value"></span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer" id="footer">
        <div class="container footer__container">
            <div class="footer__brand">
                <a href="#" class="footer__logo" id="footer-logo"></a>
                <p class="footer__description" id="footer-description"></p>
                <div class="footer__social" id="footer-social"></div>
            </div>
            <nav class="footer__nav" id="footer-nav"></nav>
            <div class="footer__bottom">
                <p class="footer__copyright" id="footer-copyright"></p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
